"90000\" />\u003ca:lumMod val=\"103000\" />\u003ca:satMod val=\"130000\" />\u003c/a:schemeClr>\u003c/a:gs>\u003ca:gs pos=\"100000\">\u003ca:schemeClr val=\"phClr\">\u003ca:shade val=\"63000\" />\u003ca:satMod val=\"120000\" />\u003c/a:schemeClr>\u003c/a:gs>\u003c/a:gsLst>\u003ca:lin ang=\"5400000\" scaled=\"0\" />\u003c/a:gradFill>\u003c/a:bgFillStyleLst>\u003c/a:fmtScheme>\u003c/a:themeElements>\u003c/a:theme>", "xl/sharedStrings.xml": "\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\u003csst xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" count=\"0\" uniqueCount=\"0\"/>", "xl/worksheets/sheet1.xml": "\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\u003cx:worksheet xmlns:x=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">\u003cx:sheetViews>\u003cx:sheetView showGridLines=\"0\" workbookViewId=\"0\">\u003cx:pane ySplit=\"1\" topLeftCell=\"A2\" activePane=\"bottomLeft\" state=\"frozen\" />\u003c/x:sheetView>\u003c/x:sheetViews>\u003cx:sheetFormatPr defaultRowHeight=\"15\" />\u003cx:cols>\u003cx:col min=\"1\" max=\"1\" width=\"15\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"2\" max=\"2\" width=\"48\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"3\" max=\"3\" width=\"15\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"4\" max=\"4\" width=\"15\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"5\" max=\"5\" width=\"15\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"6\" max=\"6\" width=\"16\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"7\" max=\"7\" width=\"16\" hidden=\"0\" customWidth=\"1\" />\u003cx:col min=\"8\" max=\"8\" width=\"10\" hidden=\"0\" customWidth=\"1\" />\u003c/x:cols>\u003cx:sheetData>\u003c/x:sheetData>\u003cx:pageMargins left=\"0.7\" right=\"0.7\" top=\"0.75\" bottom=\"0.75\" header=\"0.3\" footer=\"0.3\" />\u003c/x:worksheet>", "_rels/.rels": "﻿\u003c?xml version=\"1.0\" encoding=\"utf-8\"?>\u003cRelationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\u003cR ", "5", "5", "5", "5", "5", "5", "5"], ["2", "2", "7", "7", "7", "8", "8", "2"]]}</script>
<script>
'use strict';
// 月資料由 summary.db 驗證並嵌入；查詢及下載均使用同一資料版本。
const Inventory=JSON.parse(document.getElementById('inventoryData').textContent);
const Analysis=(()=>{
  const period=r=>Number(r['撥補年份'])*100+Number(r['撥補月份']);
  const months=(from,to)=>{const out=[];let y=Math.floor(from/100),m=from%100;while(y*100+m<=to){out.push(y*100+m);m++;if(m===13){y++;m=1}}return out};
  const compare=(a,b,key)=>typeof a[key]==='number'?a[key]-b[key]:String(a[key]).localeCompare(String(b[key]),'zh-Hant');
  function query(data,state){
    const detail=data.filter(r=>r['實發量']>0&&period(r)>=state.from&&period(r)<=state.to);
    const grouped=new Map();
    for(const r of detail){const id=r['藥品代碼'];let item=grouped.get(id);if(!item){item={id,name:r['藥品名稱'],type:r['劑型'],actual:0,qty:0,stock:r['庫存量'],stockPeriod:period(r),count:0};grouped.set(id,item)}item.actual+=r['實發量'];item.qty+=r['住院耗用'];item.count++;if(period(r)>=item.stockPeriod){item.stock=r['庫存量'];item.stockPeriod=period(r);item.name=r['藥品名稱'];item.type=r['劑型']}}
    const candidates=[...grouped.values()].filter(r=>(state.minIssued==null||r.actual>=state.minIssued)&&(state.maxIssued==null||r.actual<=state.maxIssued)&&(!state.types?.length||state.types.includes(r.type))).sort((a,b)=>compare(a,b,'name')||compare(a,b,'id'));
    const allPeriods=[...new Set(detail.map(period))].sort((a,b)=>a-b);
    const includedIds=new Set(candidates.map(r=>r.id));
    const selectedDetail=detail.filter(r=>includedIds.has(r['藥品代碼'])&&(!state.selected||r['藥品代碼']===state.selected)).sort((a,b)=>period(a)-period(b)||a['藥品代碼'].localeCompare(b['藥品代碼']));
    const rows=candidates.filter(r=>!state.selected||r.id===state.selected).sort((a,b)=>(state.direction==='asc'?1:-1)*compare(a,b,state.sortKey)||compare(a,b,'id'));
    return {rows,candidates,detail:selectedDetail,periods:allPeriods,missing:months(state.from,state.to).filter(p=>!allPeriods.includes(p))};
  }
  return {period,months,query};
})();
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('zh-TW'),monthLabel=p=>String(p),fields=Inventory.columns;
const latest=Math.max(...Inventory.sourcePeriods);
const state={from:latest,to:latest,selected:'',sortKey:'actual',direction:'desc',view:'chart',minIssued:null,maxIssued:null,types:[]};
const queryTitle=()=>'查詢區間：'+monthLabel(state.from)+(state.from===state.to?'':'–'+monthLabel(state.to));
let result,exportingChart=false;
const knownNames=new Map(Inventory.rows.map(r=>[r['藥品代碼'],r['藥品名稱']]));
const years=[...new Set(Inventory.sourcePeriods.map(p=>Math.floor(p/100)))];
for(const id of ['startYear','endYear'])for(const y of years)$(id).add(new Option(y+' 年',y));
for(const id of ['startMonth','endMonth'])for(let m=1;m<=12;m++)$(id).add(new Option(String(m).padStart(2,'0')+' 月',m));
function setDraft(from,to){$('startYear').value=Math.floor(from/100);$('startMonth').value=from%100;$('endYear').value=Math.floor(to/100);$('endMonth').value=to%100;$('pending').hidden=true}
function draft(){return {from:Number($('startYear').value)*100+Number($('startMonth').value),to:Number($('endYear').value)*100+Number($('endMonth').value),minText:$('minIssued').value.trim(),maxText:$('maxIssued').value.trim(),types:[...document.querySelectorAll('[name="drugType"]:checked')].map(input=>input.value)}}
function feedback(message=''){$('feedback').textContent=message}
function validateBounds(next){
  const values={},errors={};
  for(const [key,text] of [['minIssued',next.minText],['maxIssued',next.maxText]]){
    values[key]=null;
    if(text==='')continue;
    if(!/^[0-9]+$/.test(text)||!Number.isSafeInteger(Number(text))||Number(text)<=0){errors[key]='請輸入大於 0 的整數，或留白不限。';continue}
    values[key]=Number(text);
  }
  if(!Object.keys(errors).length&&values.minIssued!==null&&values.maxIssued!==null&&values.minIssued>values.maxIssued)errors.maxIssued='最大值不可小於最小值。';
  for(const key of ['minIssued','maxIssued']){$(key+'Error').textContent=errors[key]||'';$(key).setAttribute('aria-invalid',String(!!errors[key]))}
  return {values,errors};
}
function refreshDraft(){
  const next=draft(),changed=next.from!==state.from||next.to!==state.to||next.minText!==(state.minIssued===null?'':String(state.minIssued))||next.maxText!==(state.maxIssued===null?'':String(state.maxIssued))||next.types.join(',')!==state.types.join(',');
  $('pending').hidden=!changed;$('apply').classList.toggle('needs-apply',changed);$('conditionPanel').classList.toggle('has-pending',changed);validateBounds(next);
}
function appliedDescription(){return '條件已套用｜'+monthLabel(state.from)+(state.from===state.to?'':'–'+monthLabel(state.to))+'｜實發量：'+(state.minIssued===null&&state.maxIssued===null?'不限':(state.minIssued===null?'不限':fmt(state.minIssued))+'～'+(state.maxIssued===null?'不限':fmt(state.maxIssued)))+'｜劑型：'+(state.types.length?state.types.join('、'):'不限')}
function apply(){
  const next=draft(),checked=validateBounds(next);
  if(next.from>next.to){feedback('起始年月不能晚於結束年月；目前結果保留。');$('startMonth').focus();return}
  if(Object.keys(checked.errors).length){feedback('條件未套用：請修正實發量區間的錯誤，目前結果保留。');$(Object.keys(checked.errors)[0]).focus();return}
  state.from=next.from;state.to=next.to;state.minIssued=checked.values.minIssued;state.maxIssued=checked.values.maxIssued;state.types=next.types;
  $('minIssued').value=state.minIssued??'';$('maxIssued').value=state.maxIssued??'';refreshDraft();feedback();render();
}
function select(id){state.selected=id;$('drugCode').value=id;feedback();render()}
const columns=[['id','藥品代碼'],['name','藥品名稱'],['actual','期間實發量'],['qty','期間住院耗用'],['stock','庫存量'],['stockPeriod','庫存年月'],['type','劑型']];
function tableRows(table,headers,rows){const head=table.querySelector('thead tr'),body=table.querySelector('tbody');head.replaceChildren();body.replaceChildren();for(const title of headers){const th=document.createElement('th');th.textContent=title;head.append(th)}for(const values of rows){const tr=document.createElement('tr');values.forEach((value,i)=>{const td=document.createElement('td');td.textContent=typeof value==='number'?fmt(value):String(value);if(typeof value==='number')td.className='number';tr.append(td)});body.append(tr)}}
function sort(key){state.direction=state.sortKey===key?(state.direction==='desc'?'asc':'desc'):['name','id','type','stockPeriod'].includes(key)?'asc':'desc';state.sortKey=key;render()}
function render(){
  result=Analysis.query(Inventory.rows,state);
  $('resultCount').textContent=result.rows.length+' 個品項';
  const selectBox=$('drugSelect');selectBox.replaceChildren(new Option('全部符合條件品項',''));

const ns='http://www.w3.org/2000/svg';
function el(tag,attrs={},text){const node=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);if(text!==undefined)node.textContent=text;return node}
function chartLayout(rows){const values=rows.flatMap(r=>[r.actual,r.qty,r.stock]);let low=Math.min(0,...values),high=Math.max(0,...values);let span=high-low;if(!span)span=1;low-=span*.1;high+=span*.13;return {low,high,span:high-low,height:Math.max(230,100+rows.length*72),rowHeight:72,left:315,panelWidth:265,gap:18,plotWidth:175,width:1180}}
function drawChart({exportMode=false,rows=result?.rows||[],layout=chartLayout(rows)}={}){
  const svg=exportMode?el('svg',{xmlns:ns}):$('chart');svg.replaceChildren();svg.setAttribute('viewBox','0 0 '+layout.width+' '+layout.height);if(exportMode){svg.setAttribute('width',layout.width);svg.setAttribute('height',layout.height);svg.append(el('rect',{width:layout.width,height:layout.height,fill:'#fff'}));const style=el('style',{},'text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#25313b}.column-title{font-size:18px;font-weight:650}.drug{font-size:16px}.code{font-size:12px;fill:#78848e}.value{font-size:16px}.date{font-size:14px;fill:#64717b}.date-inside{font-size:14px;fill:white}.zero{stroke:#c8d0d6;stroke-width:1}.bar{fill:#376c89}.zero-value{fill:#78848e;font-size:12px}');svg.append(style)}
  const defs=el('defs');svg.append(defs);
  const span=layout.span,min=layout.low,x=value=>(value-min)/span*layout.plotWidth;
  svg.append(el('text',{x:0,y:35,class:'column-title'},'藥品名稱'));
  rows.forEach((r,i)=>{const y=101+i*layout.rowHeight;const label=r.name.length>34?r.name.slice(0,32)+'…':r.name;const name=el('text',{x:0,y:y-2,class:'drug'},label);name.append(el('title',{},r.name));svg.append(name,el('text',{x:0,y:y+18,class:'code'},r.id))});
  [['實發量','actual'],['住院耗用','qty'],['庫存量','stock']].forEach(([title,key],j)=>{
    const start=layout.left+j*(layout.panelWidth+layout.gap),clipId=(exportMode?'export':'live')+'panel'+j;
    svg.append(el('text',{x:start,y:35,class:'column-title'},title));
    const clip=el('clipPath',{id:clipId});clip.append(el('rect',{x:start,y:42,width:layout.panelWidth-6,height:layout.height-43}));defs.append(clip);
    const group=el('g',{'clip-path':'url(#'+clipId+')'});svg.append(group);const baseline=start+x(0);
    group.append(el('line',{x1:baseline,x2:baseline,y1:70,y2:layout.height-20,class:'zero'}),el('text',{x:baseline,y:63,'text-anchor':'middle',class:'zero-value'},'0'));
    rows.forEach((r,i)=>{const value=r[key],y=96+i*layout.rowHeight,end=start+x(value),barLeft=Math.min(end,baseline),barRight=Math.max(end,baseline),barWidth=Math.abs(end-baseline);const rect=el('rect',{x:barLeft,y:y-15,width:barWidth,height:30,class:'bar'});rect.append(el('title',{},r.id+'｜'+title+'：'+fmt(value)+(key==='stock'?'｜庫存年月：'+r.stockPeriod:'')));group.append(rect);group.append(el('text',{x:barRight+7,y:y,'dominant-baseline':'middle',class:'value'},fmt(value)));
      if(key==='stock'){if(barWidth>=58){group.append(el('text',{x:(barLeft+barRight)/2,y:y,'text-anchor':'middle','dominant-baseline':'middle',class:'date-inside'},String(r.stockPeriod)))}else{group.append(el('text',{x:barRight+7,y:y+20,class:'date'},String(r.stockPeriod)))}}
    });
  });
  return svg;
}
// 每頁沿用完整查詢結果的尺度；下載開始時固定查詢與排序快照。
function chartPages(rows){return Array.from({length:Math.ceil(rows.length/100)},(_,i)=>rows.slice(i*100,(i+1)*100))}
function outputStem(prefix){return prefix+'_'+state.from+(state.from===state.to?'':'-'+state.to)+'_'+(state.selected||'全')}
function requestSave(filename,mime,extension){
  if(!window.showSaveFilePicker)return Promise.resolve(null);
  return window.showSaveFilePicker({suggestedName:filename,startIn:'desktop',types:[{description:extension.slice(1).toUpperCase(),accept:{[mime]:[extension]}}]});
}
async function saveBlob(blob,filename,statusId,handle){
  if(handle){const writer=await handle.createWritable();try{await writer.write(blob);await writer.close()}catch(error){try{await writer.abort()}catch{}throw error}$(statusId).textContent='已儲存：'+handle.name;return}
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),15000);$(statusId).textContent='已開始下載：'+filename;
}
async function chartPng(rows,sharedLayout,title,pageIndex,pageCount,total){
  const layout={...sharedLayout,height:Math.max(230,100+rows.length*72)},full=drawChart({exportMode:true,rows,layout});
  const width=layout.width+30,height=layout.height+135,svg=el('svg',{xmlns:ns,width,height,viewBox:'0 0 '+width+' '+height});
  svg.append(el('rect',{width,height,fill:'white'}),el('text',{x:width/2,y:33,'text-anchor':'middle','font-size':24,'font-family':'sans-serif',fill:'#25313b'},'住院藥局藥品進耗存'),el('text',{x:15,y:64,'font-size':16,'font-family':'sans-serif',fill:'#64717b'},title));
  const group=el('g',{transform:'translate(15,85)'});while(full.firstChild)group.append(full.firstChild);svg.append(group);
  svg.append(el('text',{x:width/2,y:height-18,'text-anchor':'middle','font-size':14,'font-family':'sans-serif',fill:'#64717b'},'第 '+(pageIndex+1)+'／'+pageCount+' 頁｜品項 '+(pageIndex*100+1)+'–'+(pageIndex*100+rows.length)+'，共 '+total+' 項'));
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));
  const canvas=document.createElement('canvas');
  try{
    const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('圖表轉換失敗'));image.src=url});
    canvas.width=width*2;canvas.height=height*2;const context=canvas.getContext('2d');if(!context)throw new Error('無法建立圖表畫布');context.scale(2,2);context.drawImage(image,0,0);
    return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('圖表尺寸無法匯出')),'image/png'));
  }finally{URL.revokeObjectURL(url);canvas.width=canvas.height=1}
}
function allowDownload(statusId){if(result.rows.length&&result.detail.length)return true;const message='目前沒有符合條件的資料，無法下載；請調整條件後重新套用';$(statusId).textContent=message;feedback(message);return false}
async function downloadPng(){
  if(!allowDownload('downloadStatus'))return;
  const rows=result.rows.map(row=>({...row})),pages=chartPages(rows),layout=chartLayout(rows),title=queryTitle(),stem=outputStem('圖表'),extension=pages.length>1?'.zip':'.png',filename=stem+extension;
  exportingChart=true;$('downloadPng').disabled=true;
  try{
    const handle=await requestSave(filename,pages.length>1?'application/zip':'image/png',extension),parts={};
    for(let i=0;i<pages.length;i++){
      $('downloadStatus').textContent='正在產生第 '+(i+1)+'／'+pages.length+' 張圖表…';
      const png=await chartPng(pages[i],layout,title,i,pages.length,rows.length);
      if(pages.length===1){await saveBlob(png,filename,'downloadStatus',handle);return}
      parts[stem+'_'+String(i+1).padStart(2,'0')+'.png']=new Uint8Array(await png.arrayBuffer());
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    await saveBlob(zipXml(parts,'application/zip'),filename,'downloadStatus',handle);
  }catch(error){$('downloadStatus').textContent=error.name==='AbortError'?'已取消下載。':'圖表下載失敗：'+error.message+'，請重試。'}finally{exportingChart=false;$('downloadPng').disabled=false}
}
// 以預先產生的 Excel 範本套入目前期間統計，僅在瀏覽器本機產生檔案。
const XlsxTemplate=JSON.parse($('xlsxTemplate').textContent),DetailXlsxTemplate=JSON.parse($('detailXlsxTemplate').textContent);
const xmlText=value=>String(value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function zipXml(parts,mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
  const encoder=new TextEncoder(),local=[],central=[];let offset=0;
  const crcTable=Uint32Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0});
  const crc32=bytes=>{let crc=0xFFFFFFFF;for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0};
  for(const [name,xml] of Object.entries(parts)){
    const path=encoder.encode(name),data=typeof xml==='string'?encoder.encode(xml):xml,crc=crc32(data);
    const header=new Uint8Array(30+path.length),h=new DataView(header.buffer);
    h.setUint32(0,0x04034B50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,33,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,path.length,true);header.set(path,30);
    const entry=new Uint8Array(46+path.length),e=new DataView(entry.buffer);
    e.setUint32(0,0x02014B50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x800,true);e.setUint16(14,33,true);
    e.setUint32(16,crc,true);e.setUint32(20,data.length,true);e.setUint32(24,data.length,true);e.setUint16(28,path.length,true);e.setUint32(42,offset,true);entry.set(path,46);
    local.push(header,data);central.push(entry);offset+=header.length+data.length;
  }
  const end=new Uint8Array(22),e=new DataView(end.buffer),centralSize=central.reduce((sum,p)=>sum+p.length,0);
  e.setUint32(0,0x06054B50,true);e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);
  return new Blob([...local,...central,end],{type:mime});
}
function xlsxBlob(template,matrix){
  const sheetData=matrix.map((row,i)=>'<x:row r="'+(i+1)+'" ht="24" customHeight="1">'+row.map((value,j)=>{
    const ref=String.fromCharCode(65+j)+(i+1),style=template.styles[i===0?0:1][j];
    return typeof value==='number'?'<x:c r="'+ref+'" s="'+style+'" t="n"><x:v>'+value+'</x:v></x:c>':'<x:c r="'+ref+'" s="'+style+'" t="inlineStr"><x:is><x:t xml:space="preserve">'+xmlText(value)+'</x:t></x:is></x:c>';
  }).join('')+'</x:row>').join('');
  const parts={...template.parts};parts['xl/worksheets/sheet1.xml']=parts['xl/worksheets/sheet1.xml'].replace('<x:sheetData></x:sheetData>','<x:sheetData>'+sheetData+'</x:sheetData>');

async function saveXlsx(template,matrix,filename,statusId){
  try{const handle=await requestSave(filename,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','.xlsx');await saveBlob(xlsxBlob(template,matrix),filename,statusId,handle)}
  catch(error){$(statusId).textContent=error.name==='AbortError'?'已取消下載。':'下載失敗：'+error.message+'，請重試。'}
}
function downloadXlsx(){
  if(!allowDownload('tableDownloadStatus'))return;
  try{
    const matrix=[columns.map(c=>c[1]),...result.rows.map(row=>columns.map(([key])=>key==='stockPeriod'?String(row[key]):row[key]))];
    saveXlsx(XlsxTemplate,matrix,'表格_'+state.from+(state.from===state.to?'':'-'+state.to)+'_'+(state.selected||'全')+'.xlsx','tableDownloadStatus');
  }catch(error){$('tableDownloadStatus').textContent='表格下載失敗，請重試。'}
}
function downloadDetailXlsx(){
  if(!allowDownload('detailDownloadStatus'))return;

    const matrix=[fields,...result.detail.map(row=>fields.map(field=>row[field]))];
    saveXlsx(DetailXlsxTemplate,matrix,'明細.xlsx','detailDownloadStatus');
  }catch(error){$('detailDownloadStatus').textContent='明細下載失敗，請重試。'}
}
$('apply').addEventListener('click',apply);for(const id of ['startYear','startMonth','endYear','endMonth'])$(id).addEventListener('change',refreshDraft);
for(const id of ['minIssued','maxIssued']){$(id).addEventListener('input',refreshDraft);$(id).addEventListener('keydown',event=>{if(event.key==='Enter')apply()})}
for(const input of document.querySelectorAll('[name="drugType"]'))input.addEventListener('change',refreshDraft);
$('drugSelect').addEventListener('change',()=>select($('drugSelect').value));
const uppercaseCode=value=>value.replace(/[a-z]/g,letter=>letter.toUpperCase());
function search(){const code=uppercaseCode($('drugCode').value.trim());$('drugCode').value=code;if(!/^[A-Z0-9]{6}$/.test(code)){feedback('請輸入完整六碼英數藥品代碼；目前結果保留。');return}if(!result.candidates.some(r=>r.id===code)){feedback('目前套用條件沒有配對品項 '+code+'；目前結果保留。');return}select(code)}
$('drugCode').addEventListener('input',event=>{const input=event.currentTarget,start=input.selectionStart,end=input.selectionEnd;input.value=uppercaseCode(input.value);input.setSelectionRange(start,end)});
