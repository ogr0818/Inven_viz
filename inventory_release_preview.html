function apply(){const next=draft();if(next.from>next.to){feedback('起始年月不能晚於結束年月；目前結果保留。');return}state.from=next.from;state.to=next.to;$('pending').hidden=true;feedback();render()}

const ns='http://www.w3.org/2000/svg';

  try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=width*2;canvas.height=(height+95)*2;const context=canvas.getContext('2d');context.scale(2,2);context.drawImage(image,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const file=URL.createObjectURL(blob);const link=document.createElement('a');link.href=file;link.download='圖表_'+state.from+(state.from===state.to?'':'-'+state.to)+'_'+(state.selected||'全')+'.png';link.click();setTimeout(()=>URL.revokeObjectURL(file),15000);$('downloadStatus').textContent='已開始下載：'+link.download}catch(error){$('downloadStatus').textContent='圖表下載失敗，請重試。'}finally{URL.revokeObjectURL(url)}
}
// 以預先產生的 Excel 範本套入目前期間統計，僅在瀏覽器本機產生檔案。
const XlsxTemplate=JSON.parse($('xlsxTemplate').textContent),DetailXlsxTemplate=JSON.parse($('detailXlsxTemplate').textContent);
const xmlText=value=>String(value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function zipXml(parts){
  const encoder=new TextEncoder(),local=[],central=[];let offset=0;
  const crcTable=Uint32Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0});
  const crc32=bytes=>{let crc=0xFFFFFFFF;for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0};
  for(const [name,xml] of Object.entries(parts)){
    const path=encoder.encode(name),data=encoder.encode(xml),crc=crc32(data);
    const header=new Uint8Array(30+path.length),h=new DataView(header.buffer);
    h.setUint32(0,0x04034B50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,33,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,path.length,true);header.set(path,30);
    const entry=new Uint8Array(46+path.length),e=new DataView(entry.buffer);
    e.setUint32(0,0x02014B50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x800,true);e.setUint16(14,33,true);
    e.setUint32(16,crc,true);e.setUint32(20,data.length,true);e.setUint32(24,data.length,true);e.setUint16(28,path.length,true);e.setUint32(42,offset,true);entry.set(path,46);
    local.push(header,data);central.push(entry);offset+=header.length+data.length;
  }
  const end=new Uint8Array(22),e=new DataView(end.buffer),centralSize=central.reduce((sum,p)=>sum+p.length,0);
  e.setUint32(0,0x06054B50,true);e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);
  return new Blob([...local,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsxBlob(template,matrix){
  const sheetData=matrix.map((row,i)=>'<x:row r="'+(i+1)+'" ht="24" customHeight="1">'+row.map((value,j)=>{
    const ref=String.fromCharCode(65+j)+(i+1),style=template.styles[i===0?0:1][j];
    return typeof value==='number'?'<x:c r="'+ref+'" s="'+style+'" t="n"><x:v>'+value+'</x:v></x:c>':'<x:c r="'+ref+'" s="'+style+'" t="inlineStr"><x:is><x:t xml:space="preserve">'+xmlText(value)+'</x:t></x:is></x:c>';
  }).join('')+'</x:row>').join('');
  const parts={...template.parts};parts['xl/worksheets/sheet1.xml']=parts['xl/worksheets/sheet1.xml'].replace('<x:sheetData></x:sheetData>','<x:sheetData>'+sheetData+'</x:sheetData>');
  return zipXml(parts);
}
function saveXlsx(template,matrix,filename,statusId){
  const url=URL.createObjectURL(xlsxBlob(template,matrix)),link=document.createElement('a');link.href=url;link.download=filename;
  link.click();setTimeout(()=>URL.revokeObjectURL(url),15000);$(statusId).textContent='已開始下載：'+filename;
}
function downloadXlsx(){
  if(!result.rows.length)return;
  try{
    const matrix=[columns.map(c=>c[1]),...result.rows.map(row=>columns.map(([key])=>key==='stockPeriod'?String(row[key]):row[key]))];
    saveXlsx(XlsxTemplate,matrix,'表格_'+state.from+(state.from===state.to?'':'-'+state.to)+'_'+(state.selected||'全')+'.xlsx','tableDownloadStatus');
  }catch(error){$('tableDownloadStatus').textContent='表格下載失敗，請重試。'}
}
function downloadDetailXlsx(){
  if(!result.detail.length)return;
  try{
    const matrix=[fields,...result.detail.map(row=>fields.map(field=>row[field]))];
    saveXlsx(DetailXlsxTemplate,matrix,'明細.xlsx','detailDownloadStatus');
  }catch(error){$('detailDownloadStatus').textContent='明細下載失敗，請重試。'}
}

function search(){const code=uppercaseCode($('drugCode').value.trim());$('drugCode').value=code;if(!/^[A-Z0-9]{6}$/.test(code)){feedback('請輸入完整六碼英數藥品代碼；目前結果保留。');return}if(!result.candidates.some(r=>r.id===code)){feedback('目前套用區間沒有配對品項 '+code+'；目前結果保留。');return}select(code)}

for(const [id,view] of [['chartTab','chart'],['tableTab','table']])$(id).addEventListener('click',()=>{state.view=view;render()});
